{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
</header>
{{ range .RegularPages.GroupByDate "2006" }}
<h2 class="year">{{ .Key }}</h2>
<ul class="news-list">
  {{ range .Pages }}
  <li class="news-item"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
